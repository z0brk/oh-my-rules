# 从精确例外到通用分类；Git 传输先于 GitHub/Microsoft，普通共享域名先于外部 AI。
rules:
  # 拦截与内网
  - RULE-SET,aaa_block,REJECT-DROP
  - RULE-SET,aaa_ads,REJECT-DROP
  - RULE-SET,category-public-tracker,REJECT-DROP
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,lan,DIRECT,no-resolve
  - DST-PORT,123,DIRECT
  # 明确的本地例外
  - RULE-SET,aaa_direct,DIRECT
  # 服务域名优先于整应用直连；twitter 分类与 xAI 分开。
  - GEOSITE,telegram,电报服务
  - GEOIP,telegram,电报服务,no-resolve
  - GEOSITE,twitter,推特服务
  - RULE-SET,aaa_direct_process,DIRECT
  - RULE-SET,aaa_ai,AI平台
  - RULE-SET,aaa_traffic,文件下载
  - RULE-SET,aaa_proxy,默认代理
  # 上游专属分类先于厂商全集；Google/Microsoft 的普通业务直接由 MRS 覆盖。
  - RULE-SET,category-ai-!cn,AI平台
  - GEOSITE,github,开发交互
  - RULE-SET,microsoft,微软服务
  - RULE-SET,google,谷歌服务
  # 保留共享认证/客服例外和 AI Suite 的补充（含语音 IP）。
  - RULE-SET,aaa_quality,开发交互
  - RULE-SET,ai_suite,AI平台
  - RULE-SET,google_ip,谷歌服务,no-resolve
  # 国内直连；旧下载器/BT 的直连行为保留，不将全部下载程序送入流量池。
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,cloudflare-cn,DIRECT
  - RULE-SET,download,DIRECT
  - RULE-SET,cn_domain,DIRECT
  # 海外与无域名连接
  - GEOSITE,category-social-media-!cn,默认代理
  - RULE-SET,geolocation-!cn,默认代理
  - RULE-SET,cn_ip,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,默认代理
